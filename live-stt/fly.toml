# NOT DEPLOYED. Separate app on purpose: Recall's websocket retries only 3 s x 30 and then kills the endpoint for that bot, so a
# deploy of the main backend must never be able to drop live meetings. Secrets are set with `fly secrets set` (never in this file):
#   INGEST_TOKEN_SECRETS  SONIOX_API_KEY  BACKEND_SINK_SECRET  BACKEND_SINK_URL  ADMIN_TOKEN  ALERT_WEBHOOK_URL
# Non-secret defaults are in [env] below.
app = "mm-live-stt"
primary_region = "iad"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SINK = "http"
  # The Soniox account is shared with other products (org limit: 10 concurrent realtime streams): this service may use at most this many.
  MAX_SONIOX_STREAMS = "3"
  SONIOX_MODEL = "stt-rt-v6"
  SONIOX_AUTH_MODE = "header"
  SONIOX_ENDPOINT_DETECTION = "1"
  TRUST_FLY_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  [http_service.concurrency]
    type = "connections"
    soft_limit = 8
    hard_limit = 12

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[deploy]
  strategy = "rolling"
