steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'web'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web:${_BUILD_TAG}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'meeting-mind-web'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web:${_BUILD_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'

substitutions:
  _NEXT_PUBLIC_SUPABASE_URL: 'https://mlofjzlmncgnhxbiuemf.supabase.co'
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_z2oPrlsfqmjKzPHrXCyPxg_f7rOs8QJ'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: '753424767416-54viqmpd45g10oohm7vug13o8tdhb8qp.apps.googleusercontent.com'
  _NEXT_PUBLIC_API_URL: 'https://summary-ai-backend.fly.dev/v1'
  _BUILD_TAG: ${COMMIT_SHA}

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web:${_BUILD_TAG}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/meeting-mind-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
