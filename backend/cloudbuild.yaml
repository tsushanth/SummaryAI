steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend:${COMMIT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'summary-ai-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend:${COMMIT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend:${COMMIT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/meeting-mind/summary-ai-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
